# Weekly dependency update pull requests. Minor and patch updates are grouped per
# ecosystem to keep the PR count low; major versions arrive one PR each so their
# breaking changes can be reviewed on their own. CI (tests, pip-audit, npm audit)
# runs on every update PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /deploy/db]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
